# ICICI Amazon Pay statements up to mid-2022, before the Reward column was added
# to the transaction table.  Everything outside the table matches icici_cc_v1,
# but a six-role band map cannot be stretched over five printed columns: the
# engine rejects the header and the document falls to the generic parser, which
# has no issuer totals to reconcile against.
id: icici_cc_legacy_v1
issuer: ICICI Bank
doc_type: credit_card
currency: INR

fingerprint:
  # Selected on layout, not on a date cut-off a reissued statement could fall the
  # wrong side of: this header run is contiguous only in the old table, because
  # the current one prints "Transaction Details Reward Intl.#".  Sorting before
  # icici_cc_v1.yaml is what gives this template first refusal.
  all:
    - "ICICI Bank"
    - "Date SerNo. Transaction Details Intl.#"
  any:
    - "CREDIT CARD STATEMENT"

# Another broken ToUnicode CMap: here the rupee glyph decodes as a backtick.
glyph_fixes:
  "`": "₹"

layout:
  y_tolerance: 2.0

sections:
  # Intentionally empty: the column header opens each block (header_starts_block).
  starts: {}
  ends:
    - "MOST IMPORTANT TERMS"
    - "GREAT OFFERS"
    - "Page "

table:
  header_starts_block: true
  default_section: domestic
  header_tokens: ["Date", "SerNo.", "Transaction Details"]
  # "SPENDS OVERVIEW" is a sidebar caption sharing the header's baseline; align
  # the roles to the rightmost clusters so it is ignored.
  header_align: right
  header_clusters: [date, serno, description, intl, amount]
  cluster_gap: 8
  bands:
    date:        ["date.x0 - 8",         "serno.x0 - 12"]
    serno:       ["serno.x0 - 12",       "description.x0 - 8"]
    description: ["description.x0 - 8",  "intl.x0 - 8"]
    intl:        ["intl.x0 - 8",         "amount.x0 - 12"]
    amount:      ["amount.x0 - 12",      "amount.x1 + 20"]

row:
  date_formats: ["%d/%m/%Y"]
  date_pattern: '^\s*(\d{2}/\d{2}/\d{4})'
  cardholder_pattern: '^(?!.*)$'
  emi_token: "__none__"
  fcy_pattern: '(?!x)x'
  max_orphan_gap: 16.0
  drop_patterns:
    - '^Page \d+ of \d+$'

header:
  account_masked: {regex: '^(\d{4}X{8}\d{4})$'}
  statement_date: {below: "STATEMENT DATE", kind: date}
  # Printed as prose on a later page, not in the summary panel.
  billing_period: {right_of: "Statement period :", kind: period, any_page: true}

period_separator: '\s+to\s+'

summary:
  total_dues:       {below: "Total Amount due", kind: signed_amount}
  minimum_due:      {below: "Minimum Amount due"}
  previous_dues:    {below: "Previous Balance", dx: 75, kind: signed_amount}
  purchases_debits: {sum: [{below: "Purchases / Charges", dx: 75},
                           {below: "Cash Advances", dx: 75}]}
  payments_credits: {below: "Payments / Credits", dx: 75}
  credit_limit:     {below: "Credit Limit (Including cash)"}
  available_credit: {below: "Available Credit (Including cash)"}
  available_cash:   {below: "Available Cash"}
  due_date:         {below: "PAYMENT DUE DATE", kind: date}

date_formats: ["%B %d, %Y", "%d/%m/%Y"]

validate:
  - cc_summary_reconcile
  - debits_match_purchases
  - credits_match_payments
  - transactions_reconcile_to_total
  - transactions_within_period
