id: yes_bank_cc_v1
issuer: YES Bank
doc_type: credit_card
currency: INR

fingerprint:
  all:
    - "YES BANK"
  any:
    - "Credit Card Statement"

layout:
  y_tolerance: 2.0

sections:
  starts:
    "Statement Details": domestic
  ends:
    - "End of the Statement"
    - "SMS \"Help\""
    - "YES TOUCH"
    - "CIN :"
    - "Page "
    - "Important information"

table:
  # The table runs across pages and only the column header repeats on page 2,
  # so the header — not the "Statement Details" title — opens each block.
  header_starts_block: true
  default_section: domestic
  header_tokens: ["Date", "Transaction Details", "Amount"]
  header_clusters: [date, description, category, amount]
  cluster_gap: 8
  bands:
    date:        ["date.x0 - 8",        "description.x0 - 8"]
    description: ["description.x0 - 8", "category.x0 - 8"]
    category:    ["category.x0 - 8",    "amount.x0 - 20"]
    amount:      ["amount.x0 - 20",     "amount.x1 + 10"]

row:
  date_formats: ["%d/%m/%Y"]
  date_pattern: '^\s*(\d{2}/\d{2}/\d{4})'
  cardholder_pattern: '^(?!.*)$'   # this issuer prints no add-on card sub-headers
  emi_token: "__none__"
  fcy_pattern: '(?!x)x'            # never matches; no foreign-currency column
  # Reference numbers wrap above and below their own dated line.
  max_orphan_gap: 22.0
  drop_patterns:
    - '^Page \d+ of \d+$'
    - '^-+End of the Statement'

header:
  product:        {regex: '^(YES BANK [A-Z ]{3,})$'}
  account_masked: {regex: '^Statement for YES BANK Card Number\s+(\S+)$'}
  statement_date: {right_of: "Statement Date :", kind: date}
  billing_period: {text_below: "Statement Period:", kind: period}

period_separator: '\s+(?:To|to)\s+'

summary:
  previous_dues:    {below: "Previous Balance :", kind: signed_amount}
  payments_credits: {below: "Payment & Credits Received :"}
  purchases_debits: {below: "& Other Charges :"}
  total_dues:       {below: "Total Amount Due:", kind: signed_amount}
  minimum_due:      {below: "Minimum Amount Due:"}
  credit_limit:     {below: "Credit Limit:"}
  available_credit: {below: "Available Credit Limit:"}
  available_cash:   {below: "Available Cash Limit:"}
  due_date:         {right_of: "Payment Due Date:", kind: date}

date_formats: ["%d/%m/%Y"]

validate:
  - cc_summary_reconcile
  - debits_match_purchases
  - credits_match_payments
  - transactions_reconcile_to_total
  - transactions_within_period
