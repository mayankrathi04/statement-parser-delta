[project]
name = "statement-parser-delta"
version = "0.1.0"
description = "Industry-grade bank and credit card statement parser (PDF -> Excel/CSV/JSON)"
requires-python = ">=3.10"
dependencies = [
    "pdfplumber>=0.11",
    "pikepdf>=9.0",
    "pydantic>=2.7",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.29",
    "cryptography>=42.0",
    "mcp>=1.27,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
sparser = "sparser.cli:main"
sparser-mcp = "sparser.mcp_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sparser*"]

[tool.setuptools.package-data]
sparser = ["templates/*.yaml", "web/dist/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
